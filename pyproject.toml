[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "warpzone"
version = "1.0.0"
description = "WarpZone: JavaScript recon & XSS arsenal: endpoints, secrets, source maps, DOM-XSS taint and reflection probing. Created by Shaimaa Khattab."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "Shaimaa Khattab" }]
keywords = ["bugbounty", "recon", "javascript", "xss", "security", "sourcemaps", "secrets"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Programming Language :: Python :: 3",
    "Topic :: Security",
]
dependencies = ["requests>=2.25"]

[project.optional-dependencies]
game = ["rich>=13.0"]
beautify = ["jsbeautifier>=1.15"]
confirm = ["playwright>=1.40"]
all = ["rich>=13.0", "jsbeautifier>=1.15", "playwright>=1.40"]

[project.scripts]
warpzone = "warpzone.cli:main"

[tool.setuptools.packages.find]
include = ["warpzone*"]
